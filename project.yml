name: SetShot
options:
  bundleIdPrefix: com.tidbits
  deploymentTarget:
    macOS: "13.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

schemes:
  SetShot:
    build:
      targets:
        SetShot: all
        SetShotTests: [test]
    test:
      targets:
        - SetShotTests

targets:
  SetShot:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      # Resources/setshots is excluded because running setshot.sh standalone -- which
      # the test suite does -- writes its snapshots next to the script and leaves the
      # directory behind. xcodegen would otherwise make a group for it with a freshly
      # generated identifier each run, so every build dirtied the project and the next
      # release failed its own clean-tree check.
      #
      # Resources/BundledKB is excluded here and added as a folder below, so its two
      # JSON files land in Contents/Resources/BundledKB/ rather than loose at the top
      # of Resources, where version.json says nothing about what it is the version of.
      - path: SetShot
        excludes:
          - "Resources/setshots"
          - "Resources/BundledKB"
      - path: SetShot/Resources/BaseSnapshots
        type: folder
      # A copy of the knowledge base, refreshed by scripts/refresh-bundled-kb.sh.
      - path: SetShot/Resources/BundledKB
        type: folder
      # Single source for the in-app About view and the website's documentation page.
      - path: docs/documentation.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
        product: Sparkle
      - sdk: MusicKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidbits.SetShot
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0b33"
        CURRENT_PROJECT_VERSION: "45"
        INFOPLIST_KEY_CFBundleDisplayName: SetShot
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "SetShot reads Music, TV, and media settings to detect changes to your media preferences."
        INFOPLIST_KEY_SUFeedURL: "https://setshot.tidbits.com/appcast.xml"
        INFOPLIST_KEY_SUPublicEDKey: "7TX+CFEbqGbKIprRyq2sdjgmf7l3BrJf/bzp/Ss0ndg="
        # SUScheduledCheckInterval is set in SetShot/Info.plist, whose own keys win
        # over INFOPLIST_KEY_ settings here. It is one day, on top of the check at
        # every launch (UpdaterState.swift). It was 10 years, on the theory that
        # SetShot is not left running, but people do leave it open for days, and a
        # copy that never relaunched never saw a new release.
        DEVELOPMENT_TEAM: 6SCP2R96HY
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: SetShot/SetShot.entitlements
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO

  SetShotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - SetShotTests
    dependencies:
      - target: SetShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidbits.SetShotTests
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 6SCP2R96HY
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
